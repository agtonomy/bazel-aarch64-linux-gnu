name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-compile:
    name: Cross-compile (x86_64 -> aarch64, Bazel ${{ matrix.bazel }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        # Baseline (.bazelversion) and the current major. bzlmod is the only dependency
        # mode either one uses; Bazel 9 dropped WORKSPACE support entirely.
        bazel: ["7.7.1", "9.2.0"]

    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-cross-${{ matrix.bazel }}
          repository-cache: true

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Build (generic aarch64)
        working-directory: tests
        run: bazel build //:all --config=aarch64

      # Assert the compiler is ours, and that each Jetpack config gets the toolchain
      # carrying its own linux-libc headers -- which is what registering the Jetpack
      # toolchains first buys, and is otherwise invisible because every cross config
      # drives the same wrapper. See verify_toolchain.sh for why this matters.
      - name: Verify toolchain selection
        working-directory: tests
        run: |
          ./verify_toolchain.sh \
            aarch64 'toolchain/ubuntu-22.04-arm64-cross/linux_x86_64/aarch64-linux-gnu-gcc' \
            jetpack_512 'linux-libc-5.4.0-aarch64-cross/usr/aarch64-linux-gnu/include' \
            jetpack_62 'linux-libc-5.15.0-aarch64-cross/usr/aarch64-linux-gnu/include'

      - name: Verify binaries (generic aarch64)
        working-directory: tests
        run: |
          ./verify_binary.sh bazel-bin/hello_c aarch64
          ./verify_binary.sh bazel-bin/hello_cc aarch64

      - name: Run under QEMU (generic aarch64)
        working-directory: tests
        run: |
          # The repo directory carries a bzlmod canonical name, so match on the suffix
          # and insist on a single hit rather than guessing at the prefix.
          shopt -s nullglob
          archives=("$(bazel info output_base)"/external/*ubuntu-22.04-arm64-cross)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "expected exactly one cross archive repo, found: ${archives[*]:-none}" >&2
            exit 1
          fi
          SYSROOT="${archives[0]}/usr/aarch64-linux-gnu"
          qemu-aarch64-static -L "$SYSROOT" bazel-bin/hello_c
          qemu-aarch64-static -L "$SYSROOT" bazel-bin/hello_cc

      - name: Build (Jetpack 5.1.2)
        working-directory: tests
        run: bazel build //:all --config=jetpack_512

      - name: Verify binaries (Jetpack 5.1.2)
        working-directory: tests
        run: |
          ./verify_binary.sh bazel-bin/hello_c aarch64
          ./verify_binary.sh bazel-bin/hello_cc aarch64

      - name: Build (Jetpack 6.2)
        working-directory: tests
        run: bazel build //:all --config=jetpack_62

      - name: Verify binaries (Jetpack 6.2)
        working-directory: tests
        run: |
          ./verify_binary.sh bazel-bin/hello_c aarch64
          ./verify_binary.sh bazel-bin/hello_cc aarch64

      # Guards remote-execution compatibility: the hermetic sandbox bind-mounts only
      # declared inputs, so any file the toolchain reaches without declaring it fails
      # here exactly as it would on a remote executor. See tests/.bazelrc.
      - name: Build under hermetic sandbox (remote-execution guard)
        working-directory: tests
        run: |
          bazel build //:all --config=aarch64 --config=hermetic_x86_64
          bazel build //:all --config=jetpack_512 --config=hermetic_x86_64
          bazel build //:all --config=jetpack_62 --config=hermetic_x86_64

  native-x86_64:
    name: Native x86_64 (Bazel ${{ matrix.bazel }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        # Baseline (.bazelversion) and the current major. bzlmod is the only dependency
        # mode either one uses; Bazel 9 dropped WORKSPACE support entirely.
        bazel: ["7.7.1", "9.2.0"]

    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-x86-${{ matrix.bazel }}
          repository-cache: true

      - name: Build
        working-directory: tests
        run: bazel build //:all

      # Assert the compiler is ours, not the host cc toolchain rules_cc auto-detects.
      # See verify_toolchain.sh for why that is easy to miss.
      - name: Verify toolchain selection
        working-directory: tests
        run: ./verify_toolchain.sh '' 'toolchain/ubuntu-22.04-native/linux_x86_64/x86_64-linux-gnu-gcc'

      - name: Verify binaries
        working-directory: tests
        run: |
          ./verify_binary.sh bazel-bin/hello_c x86_64
          ./verify_binary.sh bazel-bin/hello_cc x86_64

      - name: Run binaries
        working-directory: tests
        run: |
          bazel-bin/hello_c
          bazel-bin/hello_cc

      - name: Build under hermetic sandbox (remote-execution guard)
        working-directory: tests
        run: bazel build //:all --config=hermetic_x86_64

  native-arm64:
    name: Native ARM64 (Bazel ${{ matrix.bazel }})
    runs-on: ubuntu-22.04-arm

    strategy:
      fail-fast: false
      matrix:
        # Baseline (.bazelversion) and the current major. bzlmod is the only dependency
        # mode either one uses; Bazel 9 dropped WORKSPACE support entirely.
        bazel: ["7.7.1", "9.2.0"]

    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-arm64-${{ matrix.bazel }}
          repository-cache: true

      - name: Build
        working-directory: tests
        run: bazel build //:all

      # Assert the compiler is ours, not the host cc toolchain rules_cc auto-detects.
      # See verify_toolchain.sh for why that is easy to miss.
      - name: Verify toolchain selection
        working-directory: tests
        run: ./verify_toolchain.sh '' 'toolchain/ubuntu-22.04-native/linux_aarch64/aarch64-linux-gnu-gcc'

      - name: Verify binaries
        working-directory: tests
        run: |
          ./verify_binary.sh bazel-bin/hello_c aarch64
          ./verify_binary.sh bazel-bin/hello_cc aarch64

      - name: Run binaries
        working-directory: tests
        run: |
          bazel-bin/hello_c
          bazel-bin/hello_cc

      - name: Build (Jetpack 5.1.2)
        working-directory: tests
        run: bazel build //:all --config=jetpack_512

      - name: Verify binaries (Jetpack 5.1.2)
        working-directory: tests
        run: |
          ./verify_binary.sh bazel-bin/hello_c aarch64
          ./verify_binary.sh bazel-bin/hello_cc aarch64

      - name: Build under hermetic sandbox (remote-execution guard)
        working-directory: tests
        run: |
          bazel build //:all --config=hermetic
          bazel build //:all --config=jetpack_512 --config=hermetic

  ci-ok:
    name: CI OK
    runs-on: ubuntu-slim
    needs:
      - cross-compile
      - native-x86_64
      - native-arm64
    if: always()
    steps:
      - name: Check all jobs passed
        uses: actions/github-script@v9
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const failures = Object.entries(needs)
              .filter(([name, job]) => job.result === 'failure')
              .map(([name]) => name);

            if (failures.length > 0) {
              core.setFailed(`The following jobs failed: ${failures.join(', ')}`);
            } else {
              core.info('All checks passed or were skipped');
            }
